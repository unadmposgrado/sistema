<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Plataforma Universitaria</title>
  <link rel="icon" type="image/png" href="img/favicon.png">

  <!-- CSS Base (común para todos los roles) -->
  <link rel="stylesheet" href="css/base.css">

  <!-- CSS específico por rol se carga dinámicamente en dashboard.js -->
  <link rel="stylesheet" id="role-css">
</head>
<body class="dashboard-page">
  <!-- 🎯 Navegación: se carga dinámicamente desde nav.js -->
  <div id="nav-placeholder" data-logged="true"></div>

  <!-- 🎨 Contenedor para el layout específico del rol -->
  <main id="layout-container" class="dashboard">
    <!-- JS inyectará aquí el layout HTML correspondiente -->
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts en orden: almacenamiento local → orquestador → navegación -->
  <script src="js/demo-store.js"></script>
  <script type="module" src="js/dashboard.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
